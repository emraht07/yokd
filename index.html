<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YÖKDİL Sosyal Bilimler</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#3b5bdb;--ok:#2f9e44;--no:#e03131;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#97a0b5;--ac:#748ffc;--bd:#2b3248}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2rem 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:.85rem;color:var(--mu)}
.tabs{display:flex;gap:6px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.passage{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:rgba(47,158,68,.15)}.opt.no{border-color:var(--no);background:rgba(224,49,49,.13)}
.why{margin-top:8px;color:var(--mu);font-size:.9rem}.tag{font-size:.75rem;color:var(--mu)}
.w b{color:var(--ac)}.hide{display:none}
#msg{color:var(--mu);padding:20px;text-align:center}
</style>
</head>
<body>
<main>
<h1>📚 YÖKDİL · Sosyal Bilimler</h1>
<div class="bar"><span class="pill" id="st"></span><span class="pill" id="acc"></span><span class="pill" id="sk"></span></div>
<div class="tabs">
  <button id="t1" class="on" onclick="tab(1)">Bugün</button>
  <button id="t2" onclick="tab(2)">Hatalarım</button>
</div>
<div id="msg"></div>
<section id="p1"><div id="words"></div><div id="quiz"></div>
  <button class="pri" onclick="newSet()">+ Yeni soru seti</button></section>
<section id="p2" class="hide"><div id="wrong"></div></section>
</main>
<script>
const TOPICS=['sosyoloji','psikoloji','siyaset bilimi','uluslararası ilişkiler','iktisat','eğitim bilimleri','tarih','felsefe','antropoloji','hukuk','iletişim','coğrafya','işletme','kamu yönetimi'];
const STAGES={1:'Seviye 1 · Temel',2:'Seviye 2 · Orta',3:'Seviye 3 · İleri (65+)'};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const dayNo=()=>Math.floor(Date.now()/864e5);
let S=JSON.parse(localStorage.getItem('yd')||'null')||{stage:1,hist:[],wrong:[],seen:[],streak:0,last:'',day:'',words:[],qs:[]};
const save=()=>localStorage.setItem('yd',JSON.stringify(S));
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(body){
  for(let i=0;i<2;i++){
    const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(r.ok) return d.items;
    if(r.status===429&&d.retry&&d.retry<=70&&i==0){
      for(let s=d.retry+2;s>0;s--){$('msg').textContent='Gemini ücretsiz kotası doldu, '+s+' sn sonra otomatik denenecek…';await sleep(1000);}
      continue;
    }
    if(r.status===429) throw new Error('Gemini ücretsiz günlük/dakikalık kotası doldu. Biraz bekleyip sayfayı yenile.');
    throw new Error(d.error||'Hata');
  }
}
function stats(){
  const h=S.hist.slice(-30),a=h.length?Math.round(100*h.filter(x=>x).length/h.length):0;
  $('st').textContent=STAGES[S.stage];$('acc').textContent='Son 30: %'+a;$('sk').textContent='🔥 '+S.streak+' gün';
  if(h.length>=30&&a>=75&&S.stage<3){S.stage++;S.hist=[];save();stats();}
  if(h.length>=30&&a<40&&S.stage>1){S.stage--;S.hist=[];save();stats();}
}
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);
  $('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)renderWrong();}

async function load(){
  if(S.last!==today()){ // yeni gün: seri hesapla
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak=S.last===y?S.streak+1:1;S.last=today();save();
  }
  stats();
  if(S.day!==today()||!S.qs.length){
    $('msg').textContent='Bugünün içeriği hazırlanıyor…';
    const topic=TOPICS[dayNo()%TOPICS.length];
    try{
      const d=await api({mode:'daily',stage:S.stage,topic,count:10,avoid:S.seen.slice(-60)});
      const w=d.words||[],q=d.questions||[];
      S.day=today();S.topic=topic;S.words=w;S.qs=q;S.seen.push(...w.map(x=>x.en));save();
    }catch(e){$('msg').textContent='⚠️ '+e.message;return;}
  }
  $('msg').textContent='';render();
}
function render(){
  $('words').innerHTML='<div class="card"><b>Günün konusu: '+esc(S.topic)+'</b> — kelimeler'+
    S.words.map(w=>'<div class="w"><b>'+esc(w.en)+'</b> — '+esc(w.tr)+'<div class="tag">'+esc(w.example)+'</div></div>').join('')+'</div>';
  $('quiz').innerHTML=S.qs.map((q,i)=>qHtml(q,i,'q')).join('');
}
function qHtml(q,i,pre){
  return '<div class="card" id="'+pre+i+'"><div class="tag">'+(i+1)+' · '+esc(q.type)+'</div>'+
    (q.passage?'<div class="passage">'+esc(q.passage)+'</div>':'')+'<div>'+esc(q.q)+'</div>'+
    (q.options||[]).map((o,j)=>'<button class="opt" onclick="ans(\''+pre+'\','+i+','+j+')">'+'ABCDE'[j]+') '+esc(o)+'</button>').join('')+
    '<div class="why hide"></div></div>';
}
function ans(pre,i,j){
  const q=(pre=='q'?S.qs:S.wrong)[i],c=$(pre+i);if(c.dataset.done)return;c.dataset.done=1;
  const bs=c.querySelectorAll('.opt');bs[q.answer].classList.add('ok');
  const right=j===q.answer;if(!right)bs[j].classList.add('no');
  const w=c.querySelector('.why');w.textContent=(right?'✅ ':'❌ ')+(q.why||'');w.classList.remove('hide');
  if(pre=='q'){S.hist.push(right);
    if(!right&&!S.wrong.some(x=>x.q===q.q))S.wrong.push(q);}
  else if(right){S.wrong.splice(i,1);}
  save();stats();
}
async function newSet(){
  $('msg').textContent='Yeni set hazırlanıyor…';
  try{const t=TOPICS[(dayNo()+Math.floor(Math.random()*13)+1)%TOPICS.length];
    S.qs=await api({mode:'quiz',stage:S.stage,topic:t,count:10});S.topic=t;save();render();$('msg').textContent='';
  }catch(e){$('msg').textContent='⚠️ '+e.message;}
}
function renderWrong(){
  $('wrong').innerHTML=S.wrong.length?S.wrong.map((q,i)=>qHtml(q,i,'w')).join(''):'<div class="card">Yanlış listen boş 🎉</div>';
}
load();
</script>
</body>
</html>
